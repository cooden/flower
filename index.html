<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f5ede0" />
  <title>贺卡工坊 · Carte de Voeux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部标题 -->
    <header class="header">
      <div class="header-ornament">
        <svg viewBox="0 0 200 24" class="ornament-line">
          <path d="M0 12 Q50 2 100 12 T200 12" fill="none" stroke="currentColor" stroke-width="1"/>
          <circle cx="100" cy="12" r="3" fill="currentColor"/>
          <circle cx="50" cy="12" r="1.5" fill="currentColor"/>
          <circle cx="150" cy="12" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="site-title">贺卡工坊</h1>
      <p class="site-subtitle">Carte de Voeux · 为她定制一份心意</p>
    </header>

    <!-- 主体：桌面端左右双栏，移动端上下堆叠 -->
    <div class="main-layout">
      <!-- 贺卡预览区 -->
      <main class="preview-wrap">
        <div id="card" class="card">
          <!-- 贺卡内容由 JS 渲染 -->
        </div>
      </main>

      <!-- 控制面板 -->
      <section class="controls">
        <!-- 节日选择 -->
        <div class="control-group">
          <label class="control-label">选择节日</label>
          <div class="festival-tabs" id="festivalTabs"></div>
        </div>

        <!-- 模板选择 -->
        <div class="control-group">
          <label class="control-label">选择风格</label>
          <div class="template-grid" id="templateGrid"></div>
        </div>

        <!-- 萌宠选择 -->
        <div class="control-group">
          <label class="control-label">添加萌宠</label>
          <div class="pet-selector" id="petSelector">
            <div class="pet-item active" data-pet="none">
              <span class="pet-icon">✕</span>
              <span class="pet-name">无</span>
            </div>
            <div class="pet-item" data-pet="rabbit">
              <span class="pet-icon">🐰</span>
              <span class="pet-name">小兔</span>
            </div>
            <div class="pet-item" data-pet="cat">
              <span class="pet-icon">🐱</span>
              <span class="pet-name">小猫</span>
            </div>
            <div class="pet-item" data-pet="dog">
              <span class="pet-icon">🐶</span>
              <span class="pet-name">小狗</span>
            </div>
          </div>
        </div>

        <!-- 花卉装饰 -->
        <div class="control-group">
          <label class="control-label">花卉装饰</label>
          <div class="pet-selector" id="flowerSelector">
            <div class="pet-item active" data-flower="none">
              <span class="pet-icon">✕</span>
              <span class="pet-name">无</span>
            </div>
            <div class="pet-item" data-flower="bouquet">
              <span class="pet-icon">💐</span>
              <span class="pet-name">花束</span>
            </div>
            <div class="pet-item" data-flower="tulip">
              <span class="pet-icon">🌷</span>
              <span class="pet-name">郁金香</span>
            </div>
            <div class="pet-item" data-flower="daisy">
              <span class="pet-icon">🌼</span>
              <span class="pet-name">雏菊</span>
            </div>
          </div>
        </div>

        <!-- 文字输入 -->
        <div class="control-group">
          <label class="control-label">称呼</label>
          <input type="text" id="inputTo" class="text-input" placeholder="致 最亲爱的你" maxlength="12" />
        </div>

        <div class="control-group">
          <label class="control-label">祝福语</label>
          <textarea id="inputMsg" class="text-input text-area" placeholder="写下你想说的话……" maxlength="120" rows="3"></textarea>
        </div>

        <div class="control-group">
          <label class="control-label">署名</label>
          <input type="text" id="inputFrom" class="text-input" placeholder="—— 爱你的我" maxlength="12" />
        </div>

        <!-- 操作按钮 -->
        <div class="action-row">
          <button class="btn btn-secondary" id="btnRandom">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            随机灵感
          </button>
          <button class="btn btn-primary" id="btnDownload">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            保存贺卡
          </button>
        </div>
      </section>
    </div>

    <footer class="footer">
      <svg viewBox="0 0 200 24" class="ornament-line">
        <path d="M0 12 Q50 22 100 12 T200 12" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="100" cy="12" r="3" fill="currentColor"/>
      </svg>
      <p>Fait avec <span class="heart">♥</span> · 愿每一张贺卡都被温柔以待</p>
    </footer>
  </div>

  <!-- 下载提示遮罩 -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
